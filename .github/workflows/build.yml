name: build

# Builds the shared library from the latest release's static library, and then
# the examples and a few small apps with this checkout's headers and CMake
# package.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - name: macOS aarch64
            os: macos-latest
            platform: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Get the static library from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "daily-core-sdk-*-${{ matrix.platform }}.zip" --dir release
          unzip -q release/*.zip -d release
          cp -R release/daily-core-sdk-*/lib .

      - name: Build the shared library
        run: |
          cmake -S shared-library -B build/shared-library -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shared-library --config Release --parallel
          cmake --install build/shared-library --config Release --prefix .

      - name: Check the shared library only exports the C API
        if: runner.os != 'Windows'
        run: |
          expected=$(grep -oE '[ *]daily_core_[a-z0-9_]+\(' include/daily_core.h | sort -u | wc -l)
          if [ "$RUNNER_OS" = Linux ]; then
            exported=$(nm -D --defined-only lib/libdaily_core.so | awk '{print $3}')
          else
            exported=$(nm -gU lib/libdaily_core.dylib | awk '{print $3}' | sed 's/^_//')
          fi
          count=$(echo "$exported" | grep -c '^daily_core_')
          others=$(echo "$exported" | grep -v '^daily_core_' || true)
          echo "Exports $count daily_core_* functions, and daily_core.h has $expected"
          if [ -n "$others" ]; then
            echo "It also exports:"
            echo "$others"
            exit 1
          fi
          [ "$count" -eq "$expected" ]

      - name: Build the examples
        run: |
          for example in c++ c++-custom-tracks; do
            cmake -S "examples/$example" -B "build/$example" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$example" --config Release --parallel
          done

      - name: Run an example
        run: |
          app=$(find build/c++ -type f \( -name daily_example -o -name daily_example.exe \) | head -1)
          "$app" | grep Usage

      - name: Check a C app with the shared library
        run: |
          mkdir -p build/c-app
          cat > build/c-app/main.c <<'C'
          #include <daily_core.h>
          #include <daily_core_version.h>
          #include <stdio.h>
          int main(void) {
              daily_core_set_log_level(DailyLogLevel_Off);
              printf("C app with Daily Core %s\n", DAILY_CORE_VERSION);
              return 0;
          }
          C
          cat > build/c-app/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(c_app LANGUAGES C)
          find_package(DailyCore REQUIRED HINTS "${CMAKE_CURRENT_LIST_DIR}/../..")
          add_executable(c_app main.c)
          target_link_libraries(c_app PRIVATE DailyCore::DailyCore)
          if(WIN32)
            add_custom_command(TARGET c_app POST_BUILD
              COMMAND ${CMAKE_COMMAND} -E copy_if_different
                $<TARGET_FILE:DailyCore::DailyCore> $<TARGET_FILE_DIR:c_app>
            )
          endif()
          CMAKE
          cmake -S build/c-app -B build/c-app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/c-app/build --config Release
          app=$(find build/c-app/build -type f \( -name c_app -o -name c_app.exe \) | head -1)
          "$app"

      - name: Check an app with the static library
        run: |
          mkdir -p build/static-app
          cat > build/static-app/main.cpp <<'CPP'
          extern "C" {
          #include <daily_core.h>
          }
          #include <daily_core_version.h>
          #include <cstdio>
          int main() {
              daily_core_set_log_level(DailyLogLevel_Off);
              std::printf("Static app with Daily Core %s\n", DAILY_CORE_VERSION);
          }
          CPP
          cat > build/static-app/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(static_app LANGUAGES CXX)
          find_package(DailyCore REQUIRED HINTS "${CMAKE_CURRENT_LIST_DIR}/../..")
          add_executable(static_app main.cpp)
          target_link_libraries(static_app PRIVATE DailyCore::DailyCoreStatic)
          CMAKE
          cmake -S build/static-app -B build/static-app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/static-app/build --config Release
          app=$(find build/static-app/build -type f \( -name static_app -o -name static_app.exe \) | head -1)
          "$app"

      # Projects that copied FindDailyCore.cmake call find_package(DailyCore)
      # with it in their module path, and set DAILY_CORE_PATH.
      - name: Check FindDailyCore.cmake
        env:
          DAILY_CORE_PATH: ${{ github.workspace }}
        run: |
          mkdir -p build/find-module
          cat > build/find-module/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(find_module LANGUAGES CXX)
          list(APPEND CMAKE_MODULE_PATH "${CMAKE_CURRENT_LIST_DIR}/../../cmake")
          find_package(DailyCore REQUIRED)
          message(STATUS "DAILY_CORE_LIBRARIES: ${DAILY_CORE_LIBRARIES}")
          CMAKE
          cmake -S build/find-module -B build/find-module/build
