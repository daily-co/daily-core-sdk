name: build

# Builds the examples and a few small apps with this checkout's headers and CMake
# package, and the latest release's library. Releases older than 0.23.0 have no
# shared library, so then there's nothing to check.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - name: macOS aarch64
            os: macos-latest
            platform: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Get the library from the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "daily-core-sdk-*-${{ matrix.platform }}.zip" --dir release
          unzip -q release/*.zip -d release
          sdk=$(echo release/daily-core-sdk-*/)
          if [ -e "$sdk/lib/libdaily_core.so" ] || [ -e "$sdk/lib/libdaily_core.dylib" ] ||
              [ -e "$sdk/bin/daily_core.dll" ]; then
            cp -R "$sdk/lib" .
            if [ -d "$sdk/bin" ]; then cp -R "$sdk/bin" .; fi
            echo "has_library=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The latest release has no shared library; skipping the checks."
            echo "has_library=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the examples
        if: steps.release.outputs.has_library == 'true'
        run: |
          for example in c++ c++-custom-tracks; do
            cmake -S "examples/$example" -B "build/$example" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$example" --config Release --parallel
          done

      - name: Run an example
        if: steps.release.outputs.has_library == 'true'
        run: |
          app=$(find build/c++ -type f \( -name daily_example -o -name daily_example.exe \) | head -1)
          "$app" | grep Usage

      - name: Check a C app
        if: steps.release.outputs.has_library == 'true'
        run: |
          mkdir -p build/c-app
          cat > build/c-app/main.c <<'C'
          #include <daily_core.h>
          #include <daily_core_version.h>
          #include <stdio.h>
          int main(void) {
              daily_core_set_log_level(DailyLogLevel_Off);
              printf("C app with Daily Core %s\n", DAILY_CORE_VERSION);
              return 0;
          }
          C
          cat > build/c-app/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(c_app LANGUAGES C)
          find_package(DailyCore REQUIRED HINTS "${CMAKE_CURRENT_LIST_DIR}/../..")
          add_executable(c_app main.c)
          target_link_libraries(c_app PRIVATE DailyCore::DailyCore)
          if(WIN32)
            add_custom_command(TARGET c_app POST_BUILD
              COMMAND ${CMAKE_COMMAND} -E copy_if_different
                $<TARGET_FILE:DailyCore::DailyCore> $<TARGET_FILE_DIR:c_app>
            )
          endif()
          CMAKE
          cmake -S build/c-app -B build/c-app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/c-app/build --config Release
          app=$(find build/c-app/build -type f \( -name c_app -o -name c_app.exe \) | head -1)
          "$app"

      - name: Check a C++ app
        if: steps.release.outputs.has_library == 'true'
        run: |
          mkdir -p build/cpp-app
          cat > build/cpp-app/main.cpp <<'CPP'
          extern "C" {
          #include <daily_core.h>
          }
          #include <daily_core_version.h>
          #include <cstdio>
          int main() {
              daily_core_set_log_level(DailyLogLevel_Off);
              std::printf("C++ app with Daily Core %s\n", DAILY_CORE_VERSION);
          }
          CPP
          cat > build/cpp-app/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(cpp_app LANGUAGES CXX)
          find_package(DailyCore REQUIRED HINTS "${CMAKE_CURRENT_LIST_DIR}/../..")
          add_executable(cpp_app main.cpp)
          target_link_libraries(cpp_app PRIVATE DailyCore::DailyCore)
          if(WIN32)
            add_custom_command(TARGET cpp_app POST_BUILD
              COMMAND ${CMAKE_COMMAND} -E copy_if_different
                $<TARGET_FILE:DailyCore::DailyCore> $<TARGET_FILE_DIR:cpp_app>
            )
          endif()
          CMAKE
          cmake -S build/cpp-app -B build/cpp-app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp-app/build --config Release
          app=$(find build/cpp-app/build -type f \( -name cpp_app -o -name cpp_app.exe \) | head -1)
          "$app"

      # Projects that copied FindDailyCore.cmake call find_package(DailyCore)
      # with it in their module path, and set DAILY_CORE_PATH.
      - name: Check FindDailyCore.cmake
        if: steps.release.outputs.has_library == 'true'
        env:
          DAILY_CORE_PATH: ${{ github.workspace }}
        run: |
          mkdir -p build/find-module
          cat > build/find-module/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(find_module LANGUAGES CXX)
          list(APPEND CMAKE_MODULE_PATH "${CMAKE_CURRENT_LIST_DIR}/../../cmake")
          find_package(DailyCore REQUIRED)
          message(STATUS "DAILY_CORE_LIBRARIES: ${DAILY_CORE_LIBRARIES}")
          CMAKE
          cmake -S build/find-module -B build/find-module/build
